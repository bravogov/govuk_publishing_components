name: Verify native RubyGems package

on:
  pull_request:
    paths:
      - "app/**"
      - "config/**"
      - "lib/**"
      - "govuk_publishing_components.gemspec"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/verify-gem-package.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    name: Package and inspect component assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out maintained source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn

      - name: Install upstream frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build the native RubyGems package
        run: gem build govuk_publishing_components.gemspec

      - name: Inspect package contents and record immutable checksum
        run: |
          ruby -rrubygems/package -e '
            packages = Dir["govuk_publishing_components-*.gem"]
            abort "Expected exactly one gem package" unless packages.length == 1
            contents = Gem::Package.new(packages.first).contents
            required = [
              "app/assets/stylesheets/govuk_publishing_components/_base.scss",
              "app/assets/stylesheets/govuk_publishing_components/components/_layout-footer.scss",
              "config/locales/en.yml",
              "node_modules/govuk-frontend"
            ]
            required.each do |prefix|
              abort "Missing required gem component: #{prefix}" unless contents.any? { |path| path.start_with?(prefix) }
            end
            puts "NATIVE_RUBYGEMS_PACKAGE_WITH_FRONTEND_ASSETS_PASS"
            puts "Gem assets: #{contents.length}"
          '
          sha256sum govuk_publishing_components-*.gem | tee package-sha256.txt

      - name: Retain inspectable package build as a CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govuh-publishing-components-gem-${{ github.sha }}
          path: |
            govuk_publishing_components-*.gem
            package-sha256.txt
          if-no-files-found: error
          retention-days: 14
